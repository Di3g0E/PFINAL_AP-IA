# ============================================================================
# P6_AP-IA — Stack local
#
# Servicios:
#   - db:           Postgres 15 con persistencia en volumen.
#   - api:          FastAPI + LangGraph + agentes + modelos pesados.
#   - cloudflared:  túnel HTTPS gratuito (opcional, descomentar si se usa).
#
# Lanzar: docker compose up --build
# Parar:  docker compose down
# Reset:  docker compose down -v   (borra el volumen de datos)
# ============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: p6-db
    environment:
      POSTGRES_DB: p6
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - p6-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d p6" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p6-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/p6
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 8000 → contenedor 7860 (el Dockerfile escucha en 7860 por HF Spaces)
      - "8000:7860"
    volumes:
      # Rutas dentro del contenedor: el Dockerfile usa /home/user/app/* (no /app/*)
      - ./data:/home/user/app/data
      - ./logs:/home/user/app/logs
      - ./models:/home/user/app/models
    restart: unless-stopped
  # --- Túnel Cloudflare (opcional) ---
  # Para exponer el backend local a internet con HTTPS y URL estable.
  # 1. Crear un túnel en https://dash.cloudflare.com → Zero Trust → Networks → Tunnels
  # 2. Copiar el token y descomentar este bloque añadiéndolo en .env como CLOUDFLARED_TOKEN
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: p6-tunnel
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
  #   depends_on:
  #     - api
  #   restart: unless-stopped

volumes:
  p6-pgdata:
